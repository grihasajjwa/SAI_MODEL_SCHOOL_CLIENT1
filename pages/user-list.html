<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management - SKYVIEW</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/navbar.css">
    <style>
        .user-section {
            margin: 20px;
            padding: 20px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .table-responsive {
            margin-top: 20px;
        }
        .action-buttons .btn {
            margin: 0 2px;
        }
        .action-buttons {
            white-space: nowrap;
        }
    </style>
</head>
<body class="bg-light">
    <div id="navbar-container"></div>
    <div class="container-fluid">
        <div class="user-section">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2>User Management</h2>
                <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addUserModal">
                    <i class="fas fa-plus"></i> Add New User
                </button>
            </div>

            <div class="table-responsive">
                <table class="table table-striped">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Username</th>
                            <th>Email</th>
                            <th>Role</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="userTableBody">
                        <!-- Users will be loaded here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Add User Modal -->
    <div class="modal fade" id="addUserModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Add New User</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="addUserForm">
                        <div class="mb-3">
                            <label for="newFirstName" class="form-label">First Name</label>
                            <input type="text" class="form-control" id="newFirstName" required>
                        </div>
                        <div class="mb-3">
                            <label for="newLastName" class="form-label">Last Name</label>
                            <input type="text" class="form-control" id="newLastName" required>
                        </div>
                        <div class="mb-3">
                            <label for="newEmail" class="form-label">Email</label>
                            <input type="email" class="form-control" id="newEmail" required>
                        </div>
                        <div class="mb-3">
                            <label for="newUsername" class="form-label">Username</label>
                            <input type="text" class="form-control" id="newUsername" required>
                        </div>
                        <div class="mb-3">
                            <label for="newPassword" class="form-label">Password</label>
                            <input type="password" class="form-control" id="newPassword" required>
                        </div>
                        <div class="mb-3">
                            <label for="newRole" class="form-label">Role</label>
                            <select class="form-select" id="newRole" required>
                                <option value="teacher">Teacher</option>
                                <option value="staff">Staff</option>
                                <option value="accountant">Accountant</option>
                                <option value="admin">Admin</option>
                                <option value="student">Student</option>
                            </select>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" onclick="addUser()">Add User</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Edit User Modal -->
    <div class="modal fade" id="editUserModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Edit User</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="editUserForm">
                        <input type="hidden" id="editUserId">
                        <div class="mb-3">
                            <label for="editFirstName" class="form-label">First Name</label>
                            <input type="text" class="form-control" id="editFirstName" required>
                        </div>
                        <div class="mb-3">
                            <label for="editLastName" class="form-label">Last Name</label>
                            <input type="text" class="form-control" id="editLastName" required>
                        </div>
                        <div class="mb-3">
                            <label for="editEmail" class="form-label">Email</label>
                            <input type="email" class="form-control" id="editEmail" required>
                        </div>
                        <div class="mb-3">
                            <label for="editRole" class="form-label">Role</label>
                            <select class="form-select" id="editRole" required>
                                <option value="teacher">Teacher</option>
                                <option value="staff">Staff</option>
                                <option value="accountant">Accountant</option>
                                <option value="admin">Admin</option>
                                <option value="student">Student</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="editIsActive">
                                <label class="form-check-label" for="editIsActive">Active</label>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" onclick="updateUser()">Update User</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Change Password Modal -->
    <div class="modal fade" id="passwordUserModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Change User Password</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="passwordUserForm">
                        <input type="hidden" id="passwordUserId">
                        <div class="mb-3">
                            <label class="form-label" for="passwordUserName">User</label>
                            <input type="text" class="form-control" id="passwordUserName" readonly>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="changedPassword">New Password</label>
                            <input type="password" class="form-control" id="changedPassword" minlength="6" required>
                            <div class="form-text">Use at least 6 characters.</div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="confirmChangedPassword">Confirm Password</label>
                            <input type="password" class="form-control" id="confirmChangedPassword" minlength="6" required>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-warning" onclick="changeUserPassword()">
                        <i class="fas fa-key me-2"></i>Change Password
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../components/navbar.js"></script>
    <script>
        // Check authentication and admin role
        if (!Auth.isAuthenticated()) {
            Auth.redirectToLogin();
        } else if (Auth.getUserRole() !== 'admin') {
            window.location.href = 'user-profile.html';
        }

        function getCurrentUserId() {
            try {
                return JSON.parse(atob(Auth.getToken().split('.')[1])).userId || '';
            } catch (error) {
                return '';
            }
        }

        function escapeHtml(value) {
            return String(value || '').replace(/[&<>"']/g, (char) => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            }[char]));
        }

        async function fetchJson(url, options = {}) {
            const response = await fetch(url, {
                ...options,
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${Auth.getToken()}`,
                    ...(options.headers || {})
                }
            });
            const data = await response.json().catch(() => ({}));
            if (!response.ok) {
                throw new Error(data.message || 'Request failed');
            }
            return data;
        }

        // Load users
        async function loadUsers() {
            try {
                const users = await fetchJson(`${CONFIG.API_URL}/users`);
                const currentUserId = getCurrentUserId();
                const tableBody = document.getElementById('userTableBody');
                tableBody.innerHTML = '';

                if (!users.length) {
                    tableBody.innerHTML = '<tr><td colspan="6" class="text-center text-muted py-4">No users found.</td></tr>';
                    return;
                }

                users.forEach(user => {
                    const isSelf = user._id === currentUserId;
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${escapeHtml(user.firstName)} ${escapeHtml(user.lastName)}</td>
                        <td>${escapeHtml(user.username)}</td>
                        <td>${escapeHtml(user.email)}</td>
                        <td><span class="badge bg-secondary">${escapeHtml(user.role)}</span></td>
                        <td>
                            <span class="badge ${user.isActive ? 'bg-success' : 'bg-danger'}">
                                ${user.isActive ? 'Active' : 'Pending Approval'}
                            </span>
                        </td>
                        <td class="action-buttons">
                            <button class="btn btn-sm btn-primary" onclick="editUser('${user._id}')" title="Edit">
                                <i class="fas fa-edit"></i>
                            </button>
                            <button class="btn btn-sm btn-warning" onclick="openPasswordModal('${user._id}', '${encodeURIComponent(user.username || '')}')" title="Change password">
                                <i class="fas fa-key"></i>
                            </button>
                            <button class="btn btn-sm ${user.isActive ? 'btn-outline-danger' : 'btn-outline-success'}" onclick="toggleUserStatus('${user._id}', ${!user.isActive})" title="${user.isActive ? 'Block' : 'Approve'}" ${isSelf ? 'disabled' : ''}>
                                <i class="fas ${user.isActive ? 'fa-ban' : 'fa-check'}"></i>
                            </button>
                            <button class="btn btn-sm btn-danger" onclick="deleteUser('${user._id}')" title="Delete" ${isSelf ? 'disabled' : ''}>
                                <i class="fas fa-trash"></i>
                            </button>
                        </td>
                    `;
                    tableBody.appendChild(row);
                });
            } catch (error) {
                console.error('Error loading users:', error);
                alert(`Failed to load users: ${error.message}`);
            }
        }

        // Add new user
        async function addUser() {
            const formData = {
                firstName: document.getElementById('newFirstName').value,
                lastName: document.getElementById('newLastName').value,
                email: document.getElementById('newEmail').value,
                username: document.getElementById('newUsername').value,
                password: document.getElementById('newPassword').value,
                role: document.getElementById('newRole').value
            };

            try {
                await fetchJson(`${CONFIG.API_URL}/users`, {
                    method: 'POST',
                    body: JSON.stringify(formData)
                });

                alert('User created successfully');
                document.getElementById('addUserForm').reset();
                bootstrap.Modal.getInstance(document.getElementById('addUserModal')).hide();
                loadUsers();
            } catch (error) {
                console.error('Error creating user:', error);
                alert(`Failed to create user: ${error.message}`);
            }
        }

        // Load user data for editing
        async function editUser(userId) {
            try {
                const user = await fetchJson(`${CONFIG.API_URL}/users/${userId}`);

                document.getElementById('editUserId').value = user._id;
                document.getElementById('editFirstName').value = user.firstName;
                document.getElementById('editLastName').value = user.lastName;
                document.getElementById('editEmail').value = user.email;
                document.getElementById('editRole').value = user.role;
                document.getElementById('editIsActive').checked = user.isActive;

                new bootstrap.Modal(document.getElementById('editUserModal')).show();
            } catch (error) {
                console.error('Error loading user data:', error);
                alert(`Failed to load user data: ${error.message}`);
            }
        }

        // Update user
        async function updateUser() {
            const userId = document.getElementById('editUserId').value;
            const formData = {
                firstName: document.getElementById('editFirstName').value,
                lastName: document.getElementById('editLastName').value,
                email: document.getElementById('editEmail').value,
                role: document.getElementById('editRole').value,
                isActive: document.getElementById('editIsActive').checked
            };

            try {
                await fetchJson(`${CONFIG.API_URL}/users/${userId}`, {
                    method: 'PUT',
                    body: JSON.stringify(formData)
                });

                alert('User updated successfully');
                bootstrap.Modal.getInstance(document.getElementById('editUserModal')).hide();
                loadUsers();
            } catch (error) {
                console.error('Error updating user:', error);
                alert(`Failed to update user: ${error.message}`);
            }
        }

        function openPasswordModal(userId, username) {
            const decodedUsername = decodeURIComponent(username || '');
            document.getElementById('passwordUserId').value = userId;
            document.getElementById('passwordUserName').value = decodedUsername;
            document.getElementById('passwordUserForm').reset();
            document.getElementById('passwordUserId').value = userId;
            document.getElementById('passwordUserName').value = decodedUsername;
            new bootstrap.Modal(document.getElementById('passwordUserModal')).show();
        }

        async function changeUserPassword() {
            const userId = document.getElementById('passwordUserId').value;
            const password = document.getElementById('changedPassword').value;
            const confirmPassword = document.getElementById('confirmChangedPassword').value;

            if (password.length < 6) {
                alert('Password must be at least 6 characters.');
                return;
            }
            if (password !== confirmPassword) {
                alert('Passwords do not match.');
                return;
            }

            try {
                await fetchJson(`${CONFIG.API_URL}/users/${userId}/password`, {
                    method: 'PUT',
                    body: JSON.stringify({ password })
                });
                alert('Password changed successfully');
                bootstrap.Modal.getInstance(document.getElementById('passwordUserModal')).hide();
                document.getElementById('passwordUserForm').reset();
            } catch (error) {
                console.error('Error changing password:', error);
                alert(`Failed to change password: ${error.message}`);
            }
        }

        async function toggleUserStatus(userId, isActive) {
            if (!confirm(`${isActive ? 'Approve' : 'Block'} this user?`)) {
                return;
            }

            try {
                await fetchJson(`${CONFIG.API_URL}/users/${userId}/status`, {
                    method: 'PUT',
                    body: JSON.stringify({ isActive })
                });
                await loadUsers();
            } catch (error) {
                console.error('Error updating user status:', error);
                alert(`Failed to update user status: ${error.message}`);
            }
        }

        // Delete user
        async function deleteUser(userId) {
            if (!confirm('Are you sure you want to delete this user?')) {
                return;
            }

            try {
                await fetchJson(`${CONFIG.API_URL}/users/${userId}`, { method: 'DELETE' });
                alert('User deleted successfully');
                loadUsers();
            } catch (error) {
                console.error('Error deleting user:', error);
                alert(`Failed to delete user: ${error.message}`);
            }
        }

        // Add logout function
        function logout() {
            Auth.logout();
        }

        // Load users on page load
        loadUsers();
    </script>
    <script src='../js/page-shell.js'></script>
</body>
</html>
