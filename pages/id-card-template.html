<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ID Card Template - Skyview Public School</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/navbar.css">
    <style>
        :root {
            --id-red: #e51b17;
            --id-blue: #281274;
            --id-ink: #241166;
        }

        body {
            background: #edf4fb;
        }

        .id-workspace {
            display: grid;
            grid-template-columns: minmax(280px, 420px) minmax(340px, 560px);
            gap: 18px;
            align-items: start;
        }

        .editor-card,
        .preview-card {
            border: 1px solid #d7e4f2;
            border-radius: 8px;
            box-shadow: 0 8px 22px rgba(28, 53, 94, 0.08);
        }

        .editor-card .form-label {
            font-weight: 700;
            font-size: 0.84rem;
            color: #334155;
            margin-bottom: 0.25rem;
        }

        .id-card {
            width: 400px;
            height: 600px;
            background: #e8f8ff;
            margin: 0 auto;
            position: relative;
            overflow: hidden;
            border: 1px solid #1f6f99;
            font-family: "Arial Narrow", "Helvetica Neue Condensed", "Arial", sans-serif;
            color: var(--id-ink);
            transform-origin: top center;
        }

        .id-card::before {
            content: "";
            position: absolute;
            inset: 132px 0 22px;
            background: linear-gradient(120deg, #f8fdff 0%, #e3faff 48%, #bff2ff 100%);
            opacity: 1;
        }

        .id-card::after {
            content: none;
        }

        .id-top-red {
            height: 50px;
            background: var(--id-red);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: "Arial", "Helvetica", sans-serif;
            font-size: 27px;
            font-weight: 900;
            letter-spacing: 1px;
            position: relative;
            z-index: 2;
        }

        .id-school-band {
            height: 77px;
            background: var(--id-blue);
            color: #ffffff;
            text-align: center;
            position: relative;
            z-index: 2;
            padding-top: 14px;
        }

        .id-school-name {
            font-family: "Arial", "Helvetica", sans-serif;
            font-size: 26px;
            line-height: 1;
            font-weight: 900;
            letter-spacing: 0;
            white-space: nowrap;
        }

        .id-school-place {
            font-family: "Arial", "Helvetica", sans-serif;
            font-size: 17px;
            line-height: 1;
            font-weight: 800;
            letter-spacing: 0;
            margin-top: 14px;
            white-space: nowrap;
        }

        .id-thin-red {
            height: 6px;
            background: var(--id-red);
            position: relative;
            z-index: 2;
        }

        .id-logo {
            position: absolute;
            top: 180px;
            left: 38px;
            width: 125px;
            height: 125px;
            z-index: 3;
            object-fit: contain;
            box-shadow: none;
            filter: none;
        }

        .id-photo-box {
            position: absolute;
            top: 149px;
            right: 43px;
            width: 127px;
            height: 155px;
            z-index: 3;
            border: 3px solid var(--id-blue);
            background: #fff100;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .id-photo-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }

        .id-photo-box.has-photo {
            background: #ffffff;
        }

        .id-photo-box.has-photo img {
            display: block;
        }

        .id-details {
            position: absolute;
            left: 30px;
            right: 30px;
            top: 339px;
            z-index: 4;
            font-family: "Arial Narrow", "Helvetica Neue Condensed", "Arial", sans-serif;
            font-weight: 800;
        }

        .id-class-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            column-gap: 18px;
            font-size: 16px;
            line-height: 1.05;
            margin-bottom: 5px;
        }

        .id-class-field {
            display: grid;
            grid-template-columns: 108px 9px minmax(0, 1fr);
            align-items: baseline;
            gap: 3px;
            min-width: 0;
        }

        .id-class-field:last-child {
            grid-template-columns: 36px 9px minmax(0, 1fr);
        }

        .id-field-row {
            display: grid;
            grid-template-columns: 108px 9px minmax(0, 1fr);
            align-items: baseline;
            gap: 3px;
            font-size: 13.5px;
            line-height: 1.16;
            letter-spacing: 0;
            min-width: 0;
            margin-bottom: 2px;
        }

        .id-field-label {
            white-space: nowrap;
            min-width: 0;
            overflow: hidden;
            text-overflow: clip;
        }

        .id-field-sep {
            text-align: center;
        }

        .id-field-value {
            min-width: 0;
            overflow-wrap: anywhere;
            word-break: break-word;
            max-height: 30px;
            overflow: hidden;
        }

        .id-signature {
            position: absolute;
            left: 30px;
            bottom: 59px;
            z-index: 4;
            width: 125px;
            text-align: center;
        }

        .id-signature img {
            width: 120px;
            height: 36px;
            object-fit: contain;
            display: block;
            margin: 0 auto -2px;
        }

        .id-signature div {
            color: #111111;
            font-size: 17px;
            font-weight: 800;
            line-height: 1;
        }

        .id-session-band {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 18px;
            min-height: 30px;
            background: var(--id-red);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 5;
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 2px;
            line-height: 1;
            padding: 4px 0 5px;
        }

        .id-session-band span {
            margin-left: 8px;
        }

        @media (max-width: 992px) {
            .id-workspace {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 480px) {
            .id-card {
                transform: scale(0.82);
                margin-bottom: -105px;
            }
        }

        @media print {
            @page {
                size: 80mm 120mm;
                margin: 0;
            }

            body {
                background: #ffffff !important;
                margin: 0 !important;
            }

            #navbar-container,
            .editor-card,
            .preview-card > .card-header {
                display: none !important;
            }

            .container-fluid,
            .preview-card,
            .preview-card .card-body {
                padding: 0 !important;
                margin: 0 !important;
                max-width: none !important;
                border: 0 !important;
                box-shadow: none !important;
            }

            .id-workspace {
                display: block !important;
            }

            .id-card {
                width: 80mm;
                height: 120mm;
                border: 0;
                transform: none !important;
                margin: 0 !important;
                print-color-adjust: exact;
                -webkit-print-color-adjust: exact;
            }
        }
    </style>
</head>
<body>
    <div id="navbar-container"></div>

    <div class="container-fluid py-3" style="max-width: 1080px;">
        <div class="id-workspace">
            <div class="card editor-card">
                <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                    <h5 class="mb-0">ID Card Details</h5>
                    <div class="d-flex gap-2">
                        <a class="btn btn-sm btn-light" href="bulk-id-card-download.html">
                            <i class="fas fa-file-zipper me-1"></i>Bulk
                        </a>
                        <button class="btn btn-sm btn-light" type="button" id="downloadIdCardPngBtn">
                            <i class="fas fa-download me-1"></i>PNG
                        </button>
                        <button class="btn btn-sm btn-light" type="button" id="printIdCardBtn">
                            <i class="fas fa-print me-1"></i>Print
                        </button>
                    </div>
                </div>
                <div class="card-body">
                    <div class="row g-2 mb-3">
                        <div class="col-8">
                            <label class="form-label" for="loadAdmissionNo">Load by Admission No</label>
                            <input class="form-control" id="loadAdmissionNo" placeholder="Admission no">
                        </div>
                        <div class="col-4">
                            <label class="form-label" for="loadSession">Session</label>
                            <input class="form-control" id="loadSession" placeholder="Current session">
                        </div>
                        <div class="col-12">
                            <button class="btn btn-outline-primary w-100" type="button" id="loadStudentBtn">
                                <i class="fas fa-search me-1"></i>Load Student
                            </button>
                        </div>
                    </div>

                    <form id="idCardForm" class="row g-2">
                        <div class="col-12">
                            <label class="form-label" for="studentNameInput">Student Name</label>
                            <input class="form-control" id="studentNameInput" data-id-field="studentName" value="Student Name">
                        </div>
                        <div class="col-6">
                            <label class="form-label" for="classInput">Class</label>
                            <input class="form-control" id="classInput" data-id-field="className" value="I">
                        </div>
                        <div class="col-6">
                            <label class="form-label" for="sectionInput">Section</label>
                            <input class="form-control" id="sectionInput" data-id-field="section" value="A">
                        </div>
                        <div class="col-6">
                            <label class="form-label" for="admissionInput">Admission No</label>
                            <input class="form-control" id="admissionInput" data-id-field="admissionNo" value="SVPS/001">
                        </div>
                        <div class="col-6">
                            <label class="form-label" for="dobInput">D.O.B.</label>
                            <input type="date" class="form-control" id="dobInput" data-id-field="dob">
                        </div>
                        <div class="col-12">
                            <label class="form-label" for="guardianInput">Guardian's Name</label>
                            <input class="form-control" id="guardianInput" data-id-field="guardianName" value="Guardian Name">
                        </div>
                        <div class="col-12">
                            <label class="form-label" for="phoneInput">Phone No.</label>
                            <input class="form-control" id="phoneInput" data-id-field="phone" value="9876543210">
                        </div>
                        <div class="col-12">
                            <label class="form-label" for="addressInput">Address</label>
                            <textarea class="form-control" id="addressInput" data-id-field="address" rows="2">Tufanganj, Coochbehar</textarea>
                        </div>
                        <div class="col-6">
                            <label class="form-label" for="sessionInput">Session</label>
                            <input class="form-control" id="sessionInput" data-id-field="session" value="" readonly>
                        </div>
                        <div class="col-6">
                            <label class="form-label" for="photoInput">Photo</label>
                            <input type="file" class="form-control" id="photoInput" accept="image/*">
                        </div>
                    </form>
                </div>
            </div>

            <div class="card preview-card">
                <div class="card-header bg-light">
                    <h5 class="mb-0">Template Preview</h5>
                </div>
                <div class="card-body">
                    <div class="id-card" id="idCard">
                        <div class="id-top-red">IDENTITY CARD</div>
                        <div class="id-school-band">
                            <div class="id-school-name" id="idSchoolName">SKYVIEW PUBLIC SCHOOL</div>
                            <div class="id-school-place" id="idSchoolAddress">TUFANGANJ, COOCHBEHAR</div>
                        </div>
                        <div class="id-thin-red"></div>
                        <img class="id-logo" id="idSchoolLogo" src="../assets/images/logo1.png" alt="School logo">
                        <div class="id-photo-box" id="photoBox">
                            <img id="studentPhotoPreview" alt="Student photo">
                        </div>
                        <div class="id-details">
                            <div class="id-field-row">
                                <span class="id-field-label">Name</span>
                                <span class="id-field-sep">:</span>
                                <span class="id-field-value" data-id-output="studentName">Student Name</span>
                            </div>
                            <div class="id-class-row">
                                <div class="id-class-field">
                                    <span>Class</span>
                                    <span>:</span>
                                    <span data-id-output="className">I</span>
                                </div>
                                <div class="id-class-field">
                                    <span>Sec.</span>
                                    <span>:</span>
                                    <span data-id-output="section">A</span>
                                </div>
                            </div>
                            <div class="id-field-row">
                                <span class="id-field-label">Admn. No</span>
                                <span class="id-field-sep">:</span>
                                <span class="id-field-value" data-id-output="admissionNo">SVPS/001</span>
                            </div>
                            <div class="id-field-row">
                                <span class="id-field-label">Guardian's Name</span>
                                <span class="id-field-sep">:</span>
                                <span class="id-field-value" data-id-output="guardianName">Guardian Name</span>
                            </div>
                            <div class="id-field-row">
                                <span class="id-field-label">D.O.B.</span>
                                <span class="id-field-sep">:</span>
                                <span class="id-field-value" data-id-output="dob">-</span>
                            </div>
                            <div class="id-field-row">
                                <span class="id-field-label">Phone No.</span>
                                <span class="id-field-sep">:</span>
                                <span class="id-field-value" data-id-output="phone">9876543210</span>
                            </div>
                            <div class="id-field-row">
                                <span class="id-field-label">Address</span>
                                <span class="id-field-sep">:</span>
                                <span class="id-field-value" data-id-output="address">Tufanganj, Coochbehar</span>
                            </div>
                        </div>
                        <div class="id-signature">
                            <img id="idPrincipalSignature" src="../assets/images/principal-signature1.png" alt="Principal signature">
                            <div>Principal</div>
                        </div>
                        <div class="id-session-band">SESSION : <span data-id-output="session">2026-2027</span></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/api.js"></script>
    <script src="../components/navbar.js"></script>
    <script src="../js/id-card-template.js"></script>
    <script src="../js/page-shell.js"></script>
</body>
</html>
