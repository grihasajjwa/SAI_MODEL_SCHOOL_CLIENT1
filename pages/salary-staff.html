<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salary Staff - Skyview Public School</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/navbar.css">
    <style>
        body { background: #f6f8fb; }
        .salary-panel { border: 1px solid #dde7f3; border-radius: 8px; box-shadow: 0 8px 24px rgba(31, 53, 89, 0.06); }
        .salary-stat { border: 1px solid #dde7f3; border-radius: 8px; background: #fff; padding: 12px 14px; }
        .salary-stat span { display: block; color: #6c757d; font-size: 0.85rem; }
        .salary-stat strong { display: block; margin-top: 4px; color: #183b67; font-size: 1.3rem; }
    </style>
</head>
<body>
    <div id="navbar-container"></div>
    <main class="container-fluid py-4" style="max-width: 1400px;">
        <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-4">
            <div>
                <h3 class="mb-1">Salary Staff</h3>
                <p class="text-muted mb-0">Add teachers and staff with salary details for monthly salary sheets.</p>
            </div>
            <a href="salary-sheet.html" class="btn btn-primary"><i class="fas fa-file-invoice-dollar me-2"></i>Make Salary Sheet</a>
        </div>

        <div class="row g-4">
            <div class="col-lg-4">
                <div class="card salary-panel">
                    <div class="card-header bg-primary text-white">
                        <h5 class="mb-0" id="salaryEmployeeFormTitle"><i class="fas fa-user-plus me-2"></i>Add Teacher / Staff</h5>
                    </div>
                    <div class="card-body">
                        <form id="salaryEmployeeForm">
                            <div id="salaryEmployeeMessage" class="alert alert-danger d-none" role="alert"></div>
                            <div class="row g-3">
                                <div class="col-md-5">
                                    <label class="form-label" for="salaryEmployeeType">Type</label>
                                    <select class="form-select" id="salaryEmployeeType" required>
                                        <option value="Teacher">Teacher</option>
                                        <option value="Staff">Staff</option>
                                    </select>
                                </div>
                                <div class="col-md-7">
                                    <label class="form-label" for="salaryEmployeeCode">Code</label>
                                    <input type="text" class="form-control" id="salaryEmployeeCode" placeholder="Optional">
                                </div>
                                <div class="col-12">
                                    <label class="form-label" for="salaryEmployeeStatus">Status</label>
                                    <select class="form-select" id="salaryEmployeeStatus" required>
                                        <option value="true">Active</option>
                                        <option value="false">Inactive</option>
                                    </select>
                                </div>
                                <div class="col-12">
                                    <label class="form-label" for="salaryEmployeeName">Name</label>
                                    <input type="text" class="form-control" id="salaryEmployeeName" required>
                                </div>
                                <div class="col-12">
                                    <label class="form-label" for="salaryEmployeeDesignation">Designation</label>
                                    <input type="text" class="form-control" id="salaryEmployeeDesignation" placeholder="Teacher, Clerk, Driver">
                                </div>
                                <div class="col-12">
                                    <label class="form-label" for="salaryEmployeePhone">Phone</label>
                                    <input type="text" class="form-control" id="salaryEmployeePhone">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label" for="salaryBasic">Basic Salary</label>
                                    <input type="number" class="form-control" id="salaryBasic" min="0" step="0.01" value="0">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label" for="salaryAllowances">Allowances</label>
                                    <input type="number" class="form-control" id="salaryAllowances" min="0" step="0.01" value="0">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label" for="salaryDeductions">Deductions</label>
                                    <input type="number" class="form-control" id="salaryDeductions" min="0" step="0.01" value="0">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label" for="salaryNetPreview">Net Salary</label>
                                    <input type="text" class="form-control bg-light" id="salaryNetPreview" readonly>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label" for="salaryBankName">Bank Name</label>
                                    <input type="text" class="form-control" id="salaryBankName">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label" for="salaryAccountNo">Account No.</label>
                                    <input type="text" class="form-control" id="salaryAccountNo">
                                </div>
                            </div>
                            <div class="d-grid mt-4">
                                <button type="submit" class="btn btn-success" id="saveSalaryEmployeeBtn"><i class="fas fa-save me-2"></i>Save Employee</button>
                                <button type="button" class="btn btn-outline-secondary mt-2 d-none" id="cancelSalaryEmployeeEditBtn">Cancel Edit</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
            <div class="col-lg-8">
                <div class="row g-3 mb-3">
                    <div class="col-md-4"><div class="salary-stat"><span>Total Active</span><strong id="salaryTotalEmployees">0</strong></div></div>
                    <div class="col-md-4"><div class="salary-stat"><span>Teachers</span><strong id="salaryTotalTeachers">0</strong></div></div>
                    <div class="col-md-4"><div class="salary-stat"><span>Staff</span><strong id="salaryTotalStaff">0</strong></div></div>
                </div>
                <div class="card salary-panel">
                    <div class="card-header bg-light">
                        <ul class="nav nav-tabs card-header-tabs" id="salaryStaffTabs" role="tablist">
                            <li class="nav-item" role="presentation">
                                <button class="nav-link active" id="salaryStaffListTab" data-bs-toggle="tab" data-bs-target="#salaryStaffListPane" type="button" role="tab" aria-controls="salaryStaffListPane" aria-selected="true">Salary List</button>
                            </li>
                            <li class="nav-item" role="presentation">
                                <button class="nav-link" id="salaryStaffDetailsTab" data-bs-toggle="tab" data-bs-target="#salaryStaffDetailsPane" type="button" role="tab" aria-controls="salaryStaffDetailsPane" aria-selected="false">Staff Details</button>
                            </li>
                        </ul>
                    </div>
                    <div class="card-body border-bottom">
                        <form id="salaryEmployeeFilterForm" class="row g-2 align-items-end">
                            <div class="col-md-4">
                                <label class="form-label" for="salaryEmployeeTypeFilter">Type</label>
                                <select class="form-select" id="salaryEmployeeTypeFilter">
                                    <option value="">All</option>
                                    <option value="Teacher">Teachers</option>
                                    <option value="Staff">Staff</option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label" for="salaryEmployeeStatusFilter">Status</label>
                                <select class="form-select" id="salaryEmployeeStatusFilter">
                                    <option value="active">Active</option>
                                    <option value="inactive">Inactive</option>
                                    <option value="all">All</option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label" for="salaryEmployeeSearch">Search</label>
                                <input type="search" class="form-control" id="salaryEmployeeSearch" placeholder="Name, code or designation">
                            </div>
                            <div class="col-md-2 d-flex gap-2">
                                <button type="submit" class="btn btn-primary flex-fill">Filter</button>
                                <button type="button" class="btn btn-outline-secondary" id="resetSalaryEmployeeFilterBtn">Reset</button>
                            </div>
                        </form>
                    </div>
                    <div class="tab-content">
                        <div class="tab-pane fade show active" id="salaryStaffListPane" role="tabpanel" aria-labelledby="salaryStaffListTab" tabindex="0">
                            <div class="table-responsive">
                                <table class="table table-hover align-middle mb-0">
                                    <thead class="table-light">
                                        <tr>
                                            <th>Type</th><th>Status</th><th>Name</th><th>Designation</th><th class="text-end">Net Salary</th><th>Actions</th>
                                        </tr>
                                    </thead>
                                    <tbody id="salaryEmployeeTableBody"><tr><td colspan="6" class="text-center text-muted py-4">Loading...</td></tr></tbody>
                                </table>
                            </div>
                        </div>
                        <div class="tab-pane fade" id="salaryStaffDetailsPane" role="tabpanel" aria-labelledby="salaryStaffDetailsTab" tabindex="0">
                            <div class="table-responsive">
                                <table class="table table-hover align-middle mb-0">
                                    <thead class="table-light">
                                        <tr>
                                            <th>Type</th><th>Status</th><th>Name</th><th>Designation</th><th>Code</th><th>Phone</th><th>Bank</th><th>Account No.</th><th class="text-end">Basic</th><th class="text-end">Allowances</th><th class="text-end">Deductions</th>
                                        </tr>
                                    </thead>
                                    <tbody id="salaryEmployeeDetailsTableBody"><tr><td colspan="11" class="text-center text-muted py-4">Loading...</td></tr></tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/api.js"></script>
    <script src="../components/navbar.js"></script>
    <script src="../js/salary-staff.js"></script>
    <script src="../js/page-shell.js"></script>
</body>
</html>
