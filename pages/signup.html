<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Skyview Public School</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-light">
    <div class="container">
        <div class="row justify-content-center align-items-center min-vh-100">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-body p-5">
                        <div class="text-center mb-4">
                            <img src="../assets/images/logo.png" alt="Skyview Logo" class="mb-4" style="max-width: 150px;">
                            <h4 class="text-primary">Create Account</h4>
                            <p class="text-muted">Please fill in your details</p>
                        </div>
                        <form id="signupForm">
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="firstName" class="form-label">First Name</label>
                                    <input type="text" class="form-control" id="firstName" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="lastName" class="form-label">Last Name</label>
                                    <input type="text" class="form-control" id="lastName" required>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label for="email" class="form-label">Email</label>
                                <input type="email" class="form-control" id="email" required>
                            </div>
                            <div class="mb-3">
                                <label for="username" class="form-label">Username</label>
                                <input type="text" class="form-control" id="username" required>
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">Password</label>
                                <input type="password" class="form-control" id="password" required>
                            </div>
                            <div class="mb-3">
                                <label for="confirmPassword" class="form-label">Confirm Password</label>
                                <input type="password" class="form-control" id="confirmPassword" required>
                            </div>
                            <div class="mb-3">
                                <label for="role" class="form-label">Role</label>
                                <select class="form-select" id="role" required>
                                    <option value="">Select Role</option>
                                    <option value="teacher">Teacher</option>
                                    <option value="staff">Staff</option>
                                    <option value="accountant">Accountant</option>
                                    <option value="admin" id="adminRoleOption">Admin</option>
                                </select>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">
                                <i class="fas fa-user-plus me-2"></i> Sign Up
                            </button>
                        </form>
                        <div class="text-center mt-3">
                            <a href="login.html" class="text-decoration-none">Already have an account? Login</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/auth.js"></script>
<script>
async function updateAdminRoleAvailability() {
    const adminOption = document.getElementById('adminRoleOption');
    if (!adminOption) return;

    try {
        const response = await fetch(`${CONFIG.API_URL}/auth/admin-status`);
        const data = await response.json();
        if (data.success && data.adminExists) {
            adminOption.remove();
        }
    } catch (error) {
        console.error('Admin status check error:', error);
    }
}

updateAdminRoleAvailability();

document.getElementById('signupForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    const btn = e.target.querySelector('button[type="submit"]');
    btn.disabled = true;
    btn.innerText = "Signing up...";

    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirmPassword').value;

    if (password !== confirmPassword) {
        alert('Passwords do not match');
        btn.disabled = false;
        btn.innerText = "Sign Up";
        return;
    }

    const userData = {
        firstName: document.getElementById('firstName').value,
        lastName: document.getElementById('lastName').value,
        email: document.getElementById('email').value,
        username: document.getElementById('username').value,
        password: password,
        role: document.getElementById('role').value
    };

    try {
        const response = await fetch(`${CONFIG.API_URL}/auth/signup`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(userData)
        });

        let data;

        try {
            data = await response.json();
        } catch (err) {
            const text = await response.text();
            console.error("Server returned non-JSON:", text);
            alert("Server error: " + text);
            btn.disabled = false;
            btn.innerText = "Sign Up";
            return;
        }

        if (response.ok && data.success) {
            alert(data.message || 'Account created successfully. Please wait for admin approval before login.');
            window.location.href = 'login.html';
        } else {
            alert(data.message || 'Signup failed');
        }

    } catch (error) {
        console.error('Signup error:', error);
        alert('Network error. Check backend connection.');
    }

    btn.disabled = false;
    btn.innerText = "Sign Up";
});
</script>
    <script src="../js/page-shell.js"></script>
</body>
</html>
