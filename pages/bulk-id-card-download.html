<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bulk ID Card Download - Skyview Public School</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/navbar.css">
    <style>
        :root {
            --id-red: #e51b17;
            --id-blue: #281274;
            --id-ink: #241166;
        }

        body {
            background: #eef5fb;
        }

        .bulk-card {
            border: 1px solid #d7e4f2;
            border-radius: 8px;
            box-shadow: 0 8px 22px rgba(28, 53, 94, 0.08);
        }

        .student-table-wrap {
            max-height: 520px;
            overflow: auto;
        }

        .render-stage {
            position: fixed;
            left: -10000px;
            top: 0;
            width: 400px;
            height: 600px;
            overflow: hidden;
            pointer-events: none;
            opacity: 0;
        }

        .id-card {
            width: 400px;
            height: 600px;
            background: #e8f8ff;
            position: relative;
            overflow: hidden;
            border: 1px solid #1f6f99;
            font-family: "Arial Narrow", "Helvetica Neue Condensed", "Arial", sans-serif;
            color: var(--id-ink);
        }

        .id-card::before {
            content: "";
            position: absolute;
            inset: 132px 0 22px;
            background: linear-gradient(120deg, #f8fdff 0%, #e3faff 48%, #bff2ff 100%);
        }

        .id-top-red {
            height: 50px;
            background: var(--id-red);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 27px;
            font-weight: 900;
            letter-spacing: 1px;
            position: relative;
            z-index: 2;
        }

        .id-school-band {
            height: 77px;
            background: var(--id-blue);
            color: #fff;
            text-align: center;
            position: relative;
            z-index: 2;
            padding-top: 14px;
        }

        .id-school-name {
            font-family: Arial, Helvetica, sans-serif;
            font-size: 26px;
            line-height: 1;
            font-weight: 900;
            white-space: nowrap;
        }

        .id-school-place {
            font-family: Arial, Helvetica, sans-serif;
            font-size: 17px;
            line-height: 1;
            font-weight: 800;
            margin-top: 14px;
            white-space: nowrap;
        }

        .id-thin-red {
            height: 6px;
            background: var(--id-red);
            position: relative;
            z-index: 2;
        }

        .id-logo {
            position: absolute;
            top: 180px;
            left: 38px;
            width: 125px;
            height: 125px;
            z-index: 3;
            object-fit: contain;
            box-shadow: none;
            filter: none;
        }

        .id-photo-box {
            position: absolute;
            top: 149px;
            right: 43px;
            width: 127px;
            height: 155px;
            z-index: 3;
            border: 3px solid var(--id-blue);
            background: #fff100;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .id-photo-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }

        .id-photo-box.has-photo {
            background: #fff;
        }

        .id-photo-box.has-photo img {
            display: block;
        }

        .id-details {
            position: absolute;
            left: 30px;
            right: 30px;
            top: 339px;
            z-index: 4;
            font-family: "Arial Narrow", "Helvetica Neue Condensed", "Arial", sans-serif;
            font-weight: 800;
        }

        .id-class-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            column-gap: 18px;
            font-size: 16px;
            line-height: 1.05;
            margin-bottom: 5px;
        }

        .id-class-field {
            display: grid;
            grid-template-columns: 108px 9px minmax(0, 1fr);
            align-items: baseline;
            gap: 3px;
            min-width: 0;
        }

        .id-class-field:last-child {
            grid-template-columns: 36px 9px minmax(0, 1fr);
        }

        .id-field-row {
            display: grid;
            grid-template-columns: 108px 9px minmax(0, 1fr);
            align-items: baseline;
            gap: 3px;
            font-size: 13.5px;
            line-height: 1.16;
            margin-bottom: 2px;
            min-width: 0;
        }

        .id-field-label {
            white-space: nowrap;
            overflow: hidden;
        }

        .id-field-value {
            min-width: 0;
            overflow-wrap: anywhere;
            word-break: break-word;
            max-height: 30px;
            overflow: hidden;
        }

        .id-signature {
            position: absolute;
            left: 30px;
            bottom: 59px;
            z-index: 4;
            width: 125px;
            text-align: center;
        }

        .id-signature img {
            width: 120px;
            height: 36px;
            object-fit: contain;
            display: block;
            margin: 0 auto -2px;
        }

        .id-signature div {
            color: #111;
            font-size: 17px;
            font-weight: 800;
            line-height: 1;
        }

        .id-session-band {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 18px;
            min-height: 30px;
            background: var(--id-red);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 5;
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 2px;
            line-height: 1;
            padding: 4px 0 5px;
        }

        .id-session-band span {
            margin-left: 8px;
        }
    </style>
</head>
<body>
    <div id="navbar-container"></div>

    <div class="container-fluid py-3" style="max-width: 1320px;">
        <div class="card bulk-card mb-3">
            <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                <h5 class="mb-0">Bulk ID Card Download</h5>
                <a href="id-card-template.html" class="btn btn-sm btn-light">
                    <i class="fas fa-address-card me-1"></i>Single ID Card
                </a>
            </div>
            <div class="card-body">
                <div class="row g-2 align-items-end">
                    <div class="col-md-3">
                        <label class="form-label" for="bulkSessionSelect">Academic Session</label>
                        <select class="form-select" id="bulkSessionSelect"></select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label" for="bulkClassSelect">Class</label>
                        <select class="form-select" id="bulkClassSelect"></select>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label" for="bulkSectionSelect">Section</label>
                        <select class="form-select" id="bulkSectionSelect"></select>
                    </div>
                    <div class="col-md-2">
                        <button type="button" class="btn btn-primary w-100" id="loadBulkStudentsBtn">
                            <i class="fas fa-users me-1"></i>Load
                        </button>
                    </div>
                    <div class="col-md-2">
                        <button type="button" class="btn btn-success w-100" id="downloadBulkZipBtn" disabled>
                            <i class="fas fa-file-zipper me-1"></i>ZIP
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div class="card bulk-card">
            <div class="card-header bg-light d-flex flex-wrap justify-content-between gap-2 align-items-center">
                <div>
                    <h6 class="mb-0">Students</h6>
                    <div class="small text-muted" id="bulkStatus">Choose session, class and section.</div>
                </div>
                <div class="d-flex gap-2">
                    <input type="search" class="form-control form-control-sm" id="bulkStudentSearch" placeholder="Search student">
                    <button type="button" class="btn btn-sm btn-outline-primary" id="selectAllBulkBtn">Select All</button>
                    <button type="button" class="btn btn-sm btn-outline-secondary" id="clearBulkBtn">Clear</button>
                </div>
            </div>
            <div class="card-body">
                <div class="student-table-wrap">
                    <table class="table table-bordered table-striped align-middle">
                        <thead class="table-light">
                            <tr>
                                <th style="width: 48px;"><input type="checkbox" id="bulkMasterCheck"></th>
                                <th>Admission No</th>
                                <th>Student</th>
                                <th>Class</th>
                                <th>Section</th>
                                <th>Guardian</th>
                                <th>Phone</th>
                            </tr>
                        </thead>
                        <tbody id="bulkStudentBody">
                            <tr><td colspan="7" class="text-center text-muted py-4">No students loaded.</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div class="render-stage" id="idCardRenderStage"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../components/navbar.js"></script>
    <script src="../js/bulk-id-card-download.js"></script>
    <script src="../js/page-shell.js"></script>
</body>
</html>
