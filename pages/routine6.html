<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>School Routine - Monday</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/navbar.css">
    <style>
     body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: #eef1f5;
  padding: 0;
  margin: 0;
  color: #333;
}

.container {
  background: #ffffff;
  padding: 30px;
  border-radius: 12px;
  max-width: 1200px;
  margin: 24px auto;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
}

h1 {
  text-align: center;
  margin-bottom: 30px;
  color: #2c3e50;
  font-size: 1.8rem;
  font-weight: 600;
}

h2 {
  margin-top: 40px;
  margin-bottom: 15px;
  color: #2d3436;
  font-size: 1.5rem;
  border-bottom: 2px solid #dfe6e9;
  padding-bottom: 6px;
}

      table {
        width: 100%;
        border-collapse: collapse;
        margin-bottom: 10px;
      }
      thead {
        background-color: #4caf50;
        color: white;
      }
      th,
      td {
        padding: 8px;
        text-align: center;
        border: 1px solid #ccc;
      }
      tr:nth-child(even) {
        background-color: #f9f9f9;
      }
      .break-row td {
        background-color: #ffe4b2;
        font-weight: bold;
        text-align: center;
      }
      select:disabled,
      input:disabled {
        background-color: #ddd;
      }
      /* Keep teacher dropdown width stable even when showing "(count)" */
      select[aria-label="Select Teacher"] {
        min-width: 130px;
        max-width: 130px;
        box-sizing: border-box;
      }
      .settings {
  margin-bottom: 30px;
  background-color: #f1f3f5;
  padding: 20px;
  border-radius: 10px;
  display: flex;
  flex-wrap: wrap;
  gap: 15px;
  align-items: center;
}

.settings label {
  font-weight: 500;
  color: #34495e;
}

.settings input[type="number"] {
  width: 70px;
}

.action-buttons {
  margin-top: 20px;
  margin-bottom: 40px;
  display: flex;
  gap: 10px;
}

.action-buttons button {
  background-color: #3498db;
  color: white;
  padding: 8px 16px;
  font-weight: 500;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  transition: background-color 0.2s ease-in-out;
}

.action-buttons button:hover {
  background-color: #2e86de;
}

label[for="days"] {
  font-weight: 500;
  display: block;
  margin-top: 20px;
  margin-bottom: 8px;
}

select#days {
  padding: 8px 12px;
  font-size: 1rem;
  border-radius: 6px;
  border: 1px solid #ced4da;
  background-color: white;
  min-width: 180px;
  margin-right: 15px;
}

button#exportExcelBtn,
button#exportExcelBtnt,
button#fetchRoutineBtn { /* Added fetchRoutineBtn here for consistent styling */
  padding: 8px 14px;
  font-size: 0.95rem;
  font-weight: 500;
  color: white;
  background-color: #27ae60; /* Default green, will be overridden by specific IDs */
  border: none;
  border-radius: 6px;
  cursor: pointer;
  margin-top: 10px;      /* Consistent margin */
  margin-right: 10px;    /* Consistent margin */
  transition: background-color 0.2s ease-in-out;
}

button#exportExcelBtnt {
  background-color: #f39c12;
}

button#fetchRoutineBtn { /* Specific style for fetch button */
  background-color: #2980b9;
}

button#exportExcelBtn:hover {
  background-color: #1e8449;
}
button#exportExcelBtnt:hover {
  background-color: #d68910;
}
button#fetchRoutineBtn:hover {
  background-color: #21618c;
}
#generateRoutineBtn{
    background-color: #8e44ad;
    color: white;
    padding: 8px 16px;
    font-weight: 500;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    transition: background-color 0.2s ease-in-out;
}
    </style>
  </head>
  <body>
    <!-- Navbar will be loaded here -->
    <div id="navbar-container"></div>
    
    <div class="container mt-4">
      <div class="settings" id="settings"></div>
      <div class="settings" id="teacherFormContainer">
        <label>
          Add Teacher:
          <input type="text" id="newTeacherName" placeholder="Teacher name" />
        </label>
        <label>
          Code:
          <input type="text" id="newTeacherCode" placeholder="Optional code" />
        </label>
        <button id="addTeacherBtn">Save Teacher</button>
        <button id="reloadTeachersBtn">Reload Teachers</button>
      </div>
      <div class="settings" id="sessionFormContainer">
        <label for="academicSessionSelect">Academic Session:</label>
        <select id="academicSessionSelect"></select>
        <label>
          Add Session:
          <input
            type="text"
            id="newSessionName"
            placeholder="e.g. 2025-2026"
          />
        </label>
        <button id="addSessionBtn">Save Session</button>
        <button id="reloadSessionsBtn">Reload Sessions</button>
      </div>
      <div class="settings" id="classFormContainer">
        <span>
          Classes for the selected session are synced from Academic Records, including sections.
        </span>
        <button id="reloadClassesBtn">Reload Classes & Sections</button>
      </div>
      <div>
        <label
          ><input type="checkbox" id="teacherCheck" checked /> Teacher</label
        >
        <label><input type="checkbox" id="subjectCheck" /> Subject</label>
        <label><input type="checkbox" id="bookCheck" /> Book</label>
        <button id="exportExcelBtn">Export Excel</button>
        <button id="exportExcelBtnt">Export Excel teacher rotine</button>
        <button id="manageTeachersBtn">Manage Teachers</button>
        <button id="manageSubjectsBtn">Manage Subjects</button>
      </div>
      <h1 id="routine-heading">School Routine - Monday</h1>

      <label for="days">Choose a day:</label>
      <select id="days">
        <!-- Options will be added by JavaScript -->
      </select>

      <div id="routineTables"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <style>
      /* Simple modal styles */
      #modalOverlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.4);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 9999;
      }
      #modalContent {
        background: #ffffff;
        padding: 20px;
        border-radius: 10px;
        max-width: 700px;
        width: 90%;
        max-height: 80vh;
        overflow-y: auto;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
      }
      #modalContent h2 {
        margin-top: 0;
        margin-bottom: 10px;
      }
      #modalContent table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 10px;
      }
      #modalContent th,
      #modalContent td {
        border: 1px solid #ccc;
        padding: 6px;
        font-size: 0.85rem;
        text-align: left;
      }
      #modalContent input[type="text"],
      #modalContent input[type="number"] {
        width: 100%;
        box-sizing: border-box;
      }
      #modalCloseBtn {
        margin-top: 10px;
      }
    </style>

    <div id="modalOverlay">
      <div id="modalContent">
        <h2 id="modalTitle"></h2>
        <div id="modalBody"></div>
        <button id="modalCloseBtn">Close</button>
      </div>
    </div>

    <script src="../js/config.js"></script>
    <script src="../js/auth.js"></script>
    <script>
      const API_BASE_URL = CONFIG.API_URL;
      const days = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday","Saturday", "Sunday"];
      const dropdown = document.getElementById("days");
      const heading = document.getElementById("routine-heading");
      const academicSessionSelect = document.getElementById(
        "academicSessionSelect"
      );
      const modalOverlay = document.getElementById("modalOverlay");
      const modalTitle = document.getElementById("modalTitle");
      const modalBody = document.getElementById("modalBody");
      const modalCloseBtn = document.getElementById("modalCloseBtn");

      // Populate dropdown
      days.forEach((day) => {
        const option = document.createElement("option");
        option.value = day;
        option.textContent = day;
        dropdown.appendChild(option);
      });

      // Set default value
      dropdown.value = "Monday";

      // Update heading on change and call fetchRoutineBtn.onclick (if defined)
      dropdown.addEventListener("change", () => {
        heading.textContent = `School Routine - ${dropdown.value}`;
        if (typeof fetchRoutineBtn !== "undefined") {
          fetchRoutineBtn.onclick();
        }
      });

      let academicSession = "Default";
      let academicSessions = [];
      let classes = [];
      let classEntries = [];
      let classPeriodsConfig = {};
      let routineSubjects = [];
      let teachers = [];

      function buildRoutineClassKey(className, section) {
        const normalizedClassName = String(className || "").trim();
        const normalizedSection = String(section || "").trim();
        return normalizedSection
          ? `${normalizedClassName} - Section ${normalizedSection}`
          : normalizedClassName;
      }

      function getElementKey(value) {
        return String(value || "").replace(/[^a-zA-Z0-9_-]/g, "");
      }

      function getAuthHeaders(extraHeaders = {}) {
        const token = Auth.getToken();
        return token
          ? {
              ...extraHeaders,
              Authorization: `Bearer ${token}`,
            }
          : extraHeaders;
      }

      async function loadSessions() {
        try {
          const res = await fetch(`${API_BASE_URL}/sessions`);
          if (!res.ok) {
            throw new Error(`Failed to fetch sessions. Status: ${res.status}`);
          }
          const data = await res.json();
          const sessionRecords = Array.isArray(data.sessions) ? data.sessions : [];
          academicSessions = sessionRecords
            .map((s) => (typeof s === "string" ? s : s?.name))
            .filter(Boolean);

          // Populate dropdown
          academicSessionSelect.innerHTML = "";
          academicSessions.forEach((s) => {
            const opt = document.createElement("option");
            opt.value = s;
            opt.textContent = s;
            academicSessionSelect.appendChild(opt);
          });

          const currentSession =
            sessionRecords.find((s) => s && typeof s === "object" && s.isCurrent)?.name ||
            academicSessionSelect.value ||
            academicSessions[0] ||
            "Default";
          academicSession = currentSession;
          academicSessionSelect.value = academicSession;

          console.log("Loaded sessions:", academicSessions);
        } catch (err) {
          console.error("Error loading sessions:", err);
          // Fallback: show Default
          academicSessions = ["Default"];
          academicSessionSelect.innerHTML = `<option value="Default">Default</option>`;
          academicSession = "Default";
        }
      }

      async function saveSession() {
        const nameInput = document.getElementById("newSessionName");
        const name = nameInput.value.trim();
        if (!name) {
          alert("Please enter a session name.");
          return;
        }

        try {
          const res = await fetch(`${API_BASE_URL}/sessions`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name }),
          });
          const data = await res.json();
          if (!res.ok || !data.success) {
            alert(data.message || "Failed to save session.");
            return;
          }
          alert("Session saved successfully.");
          nameInput.value = "";
          await loadSessions();
        } catch (err) {
          console.error("Error saving session:", err);
          alert("Error saving session. Please try again.");
        }
      }

      academicSessionSelect.addEventListener("change", async () => {
        academicSession = academicSessionSelect.value || "Default";
        // Reload session-scoped data and refetch routines for new session/day
        await loadAcademicClasses();
        await loadTeachers();
        await loadSubjects();
        createSettings();
        if (typeof fetchRoutineBtn !== "undefined") {
          fetchRoutineBtn.onclick();
        }
      });

      async function loadAcademicClasses() {
        try {
          const res = await fetch(
            `${API_BASE_URL}/classes/year/${encodeURIComponent(
              academicSession
            )}`,
            {
              headers: getAuthHeaders(),
            }
          );
          if (!res.ok) {
            throw new Error(
              `Failed to fetch academic classes. Status: ${res.status}`
            );
          }
          const data = await res.json();
          const academicClasses = Array.isArray(data) ? data : [];
          const nextPeriodConfig = {};
          const seen = new Set();

          classEntries = academicClasses
            .map((entry) => {
              const className = String(entry.className || "").trim();
              const section = String(entry.section || "").trim();
              const key = buildRoutineClassKey(className, section);

              if (!className || seen.has(key)) {
                return null;
              }

              seen.add(key);
              nextPeriodConfig[key] = classPeriodsConfig[key] || 6;

              return {
                key,
                className,
                section,
              };
            })
            .filter(Boolean)
            .sort((a, b) => a.key.localeCompare(b.key, undefined, { numeric: true }));

          classes = classEntries.map((entry) => entry.key);
          classPeriodsConfig = nextPeriodConfig;
        } catch (err) {
          console.error("Error loading academic classes:", err);
          classEntries = [];
          classes = [];
          classPeriodsConfig = {};
        }
      }

      let teacherList = [];

      async function loadSubjects() {
        try {
          const res = await fetch(
            `${API_BASE_URL}/routine-subjects?session=${encodeURIComponent(
              academicSession
            )}`
          );
          if (!res.ok) {
            throw new Error(`Failed to fetch subjects. Status: ${res.status}`);
          }
          const data = await res.json();
          routineSubjects = (data.subjects || []).map((subject) => ({
            _id: subject._id,
            name: subject.name,
            sortOrder: subject.sortOrder || 0,
          }));
        } catch (err) {
          console.error("Error loading subjects:", err);
          routineSubjects = [];
        }
      }

      async function loadTeachers() {
        try {
          const res = await fetch(
            `${API_BASE_URL}/teachers?session=${encodeURIComponent(
              academicSession
            )}`
          );
          if (!res.ok) {
            throw new Error(`Failed to fetch teachers. Status: ${res.status}`);
          }
          const data = await res.json();
          teacherList = data.teachers || [];
          teachers = teacherList.map((t) => t.name);
          console.log("Loaded teachers:", teachers);
        } catch (err) {
          console.error("Error loading teachers:", err);
          teacherList = [];
          teachers = [];
        }
      }

      async function saveTeacher() {
        const nameInput = document.getElementById("newTeacherName");
        const codeInput = document.getElementById("newTeacherCode");
        const name = nameInput.value.trim();
        const code = codeInput.value.trim();

        if (!name) {
          alert("Please enter a teacher name.");
          return;
        }

        try {
          const res = await fetch(`${API_BASE_URL}/teachers`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({ name, code, session: academicSession }),
          });

          const data = await res.json();

          if (!res.ok || !data.success) {
            alert(data.message || "Failed to save teacher.");
            return;
          }

          alert(`Teacher saved successfully for ${academicSession}.`);
          nameInput.value = "";
          codeInput.value = "";

          // Reload teachers list so new teacher appears in dropdowns
          await loadTeachers();
          createSettings();
        } catch (err) {
          console.error("Error saving teacher:", err);
          alert("Error saving teacher. Please try again.");
        }
      }

      function openModal(title, bodyHtml) {
        modalTitle.textContent = title;
        modalBody.innerHTML = bodyHtml;
        modalOverlay.style.display = "flex";
      }

      function closeModal() {
        modalOverlay.style.display = "none";
      }

      function openTeacherManager() {
        if (!teacherList.length) {
          modalBody.innerHTML = "<p>No teachers found.</p>";
          openModal("Manage Teachers (Session: " + academicSession + ")", modalBody.innerHTML);
          return;
        }

        let html = `<table>
          <thead>
            <tr>
              <th>Name</th>
              <th>Code</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>`;

        teacherList.forEach((t) => {
          html += `<tr>
            <td><input type="text" id="teacher-name-${t._id}" value="${t.name || ""}"></td>
            <td><input type="text" id="teacher-code-${t._id}" value="${t.code || ""}"></td>
            <td>
              <button onclick="updateTeacherFromModal('${t._id}')">Save</button>
              <button onclick="deleteTeacherFromModal('${t._id}')">Delete</button>
            </td>
          </tr>`;
        });

        html += `</tbody></table>`;
        openModal("Manage Teachers (Session: " + academicSession + ")", html);
      }

      async function updateTeacherFromModal(id) {
        const nameInput = document.getElementById(`teacher-name-${id}`);
        const codeInput = document.getElementById(`teacher-code-${id}`);
        const name = nameInput.value.trim();
        const code = codeInput.value.trim();

        if (!name) {
          alert("Teacher name is required.");
          return;
        }

        try {
          const res = await fetch(`${API_BASE_URL}/teachers/${id}`, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name, code, session: academicSession }),
          });
          const data = await res.json();
          if (!res.ok || !data.success) {
            alert(data.message || "Failed to update teacher.");
            return;
          }
          alert("Teacher updated.");
          await loadTeachers();
          createSettings();
          openTeacherManager();
        } catch (err) {
          console.error("Error updating teacher:", err);
          alert("Error updating teacher. Please try again.");
        }
      }

      async function deleteTeacherFromModal(id) {
        if (!confirm("Delete this teacher?")) return;

        try {
          const res = await fetch(`${API_BASE_URL}/teachers/${id}`, {
            method: "DELETE",
          });
          const data = await res.json();
          if (!res.ok || !data.success) {
            alert(data.message || "Failed to delete teacher.");
            return;
          }
          await loadTeachers();
          createSettings();
          openTeacherManager();
        } catch (err) {
          console.error("Error deleting teacher:", err);
          alert("Error deleting teacher. Please try again.");
        }
      }

      function openSubjectManager() {
        const rows = routineSubjects.length
          ? routineSubjects.map((subject, index) => `
            <tr>
              <td><input type="text" id="subject-name-${subject._id}" value="${subject.name || ""}"></td>
              <td><input type="number" id="subject-order-${subject._id}" value="${subject.sortOrder ?? index}" style="width:90px"></td>
              <td>
                <button onclick="updateSubjectFromModal('${subject._id}')">Save</button>
                <button onclick="deleteSubjectFromModal('${subject._id}')">Delete</button>
              </td>
            </tr>`).join("")
          : `<tr><td colspan="3">No subjects configured.</td></tr>`;

        const html = `
          <div style="display:flex; gap:10px; margin-bottom:12px; align-items:end;">
            <div>
              <label for="newRoutineSubjectName">New Subject</label>
              <input type="text" id="newRoutineSubjectName" placeholder="Subject name">
            </div>
            <div>
              <label for="newRoutineSubjectOrder">Sort Order</label>
              <input type="number" id="newRoutineSubjectOrder" value="${routineSubjects.length}" style="width:90px">
            </div>
            <button onclick="createSubjectFromModal()">Add Subject</button>
          </div>
          <table>
            <thead>
              <tr>
                <th>Name</th>
                <th>Order</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>`;

        openModal("Manage Subjects (Session: " + academicSession + ")", html);
      }

      async function createSubjectFromModal() {
        const name = document.getElementById("newRoutineSubjectName").value.trim();
        const sortOrder = parseInt(document.getElementById("newRoutineSubjectOrder").value, 10) || 0;
        if (!name) {
          alert("Subject name is required.");
          return;
        }

        try {
          const res = await fetch(`${API_BASE_URL}/routine-subjects`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name, sortOrder, session: academicSession }),
          });
          const data = await res.json();
          if (!res.ok || !data.success) {
            alert(data.message || "Failed to save subject.");
            return;
          }
          await loadSubjects();
          createSettings();
          openSubjectManager();
        } catch (err) {
          console.error("Error saving subject:", err);
          alert("Error saving subject. Please try again.");
        }
      }

      async function updateSubjectFromModal(id) {
        const name = document.getElementById(`subject-name-${id}`).value.trim();
        const sortOrder = parseInt(document.getElementById(`subject-order-${id}`).value, 10) || 0;
        if (!name) {
          alert("Subject name is required.");
          return;
        }

        try {
          const res = await fetch(`${API_BASE_URL}/routine-subjects/${id}`, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name, sortOrder, session: academicSession }),
          });
          const data = await res.json();
          if (!res.ok || !data.success) {
            alert(data.message || "Failed to update subject.");
            return;
          }
          await loadSubjects();
          createSettings();
          openSubjectManager();
        } catch (err) {
          console.error("Error updating subject:", err);
          alert("Error updating subject. Please try again.");
        }
      }

      async function deleteSubjectFromModal(id) {
        if (!confirm("Delete this subject?")) return;

        try {
          const res = await fetch(`${API_BASE_URL}/routine-subjects/${id}`, {
            method: "DELETE",
          });
          const data = await res.json();
          if (!res.ok || !data.success) {
            alert(data.message || "Failed to delete subject.");
            return;
          }
          await loadSubjects();
          createSettings();
          openSubjectManager();
        } catch (err) {
          console.error("Error deleting subject:", err);
          alert("Error deleting subject. Please try again.");
        }
      }
      // Helper to strip "(count)" labels from all teacher selects
      function stripAllTeacherLabels() {
        document
          .querySelectorAll('select[aria-label="Select Teacher"]')
          .forEach((sel) => {
            Array.from(sel.options).forEach((opt) => {
              if (!opt.value) return;
              // Keep just the teacher name (value)
              opt.textContent = opt.value;
            });
          });
      }
      const allPeriods = [
        { period: "1st", time: "10.25 - 11.05" },
        { period: "2nd", time: "11.05 - 11.45" },
        { period: "3rd", time: "11.45 - 12.25" },
        { period: "Break", time: "12.25 - 12.50" },
        { period: "4th", time: "12.50 - 01.30" },
        { period: "5th", time: "01.30 - 02.05" },
        { period: "6th", time: "02.05 - 02.40" },
        { period: "7th", time: "02.40 - 03.15" },
      ];
      const settingsDiv = document.getElementById("settings");
      const tablesContainer = document.getElementById("routineTables");

      // When clicking anywhere outside a select, hide all "(count)" labels
      document.addEventListener("click", (e) => {
        if (!e.target.closest("select")) {
          stripAllTeacherLabels();
        }
      });

      function createSettings() {
        settingsDiv.innerHTML = "";
        if (!classes.length) {
          const emptyState = document.createElement("p");
          emptyState.className = "mb-0";
          emptyState.textContent =
            "No classes are available for this academic session in Academic Records yet.";
          settingsDiv.appendChild(emptyState);
        }

        classes.forEach((cls) => {
          const label = document.createElement("label");
          label.innerHTML = `${cls} Periods: `;
          const input = document.createElement("input");
          input.type = "number";
          input.id = `${getElementKey(cls)}Periods`;
          input.value = classPeriodsConfig[cls] || 6;
          input.min = 1;
          input.max = 10;
          label.appendChild(input);
          settingsDiv.appendChild(label);
        });
        const btn = document.createElement("button");
        btn.textContent = "Generate Routine";
        btn.id = "generateRoutineBtn";
        btn.onclick = generateRoutine;
        btn.disabled = classes.length === 0;
        settingsDiv.appendChild(btn);
        settingsDiv.appendChild(fetchRoutineBtn);
      }

      function collectRoutinePeriods(tbody) {
        const periods = [];

        Array.from(tbody.rows).forEach((row) => {
          if (row.classList.contains("break-row")) return;

          periods.push({
            period: row.cells[0].textContent,
            time: row.cells[1].textContent,
            teacher: row.cells[2].querySelector("select")?.value || "",
            subject: row.cells[3].querySelector("select")?.value || "",
            book: row.cells[4].querySelector("input")?.value || "",
          });
        });

        return periods;
      }

      async function saveRoutineForClass(classKey, tbody, selectedDay, saveButton) {
        const originalLabel = saveButton ? saveButton.textContent : "";

        try {
          if (saveButton) {
            saveButton.disabled = true;
            saveButton.textContent = "Saving...";
          }

          const response = await fetch(`${API_BASE_URL}/routines/save-routine`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              class: classKey,
              day: selectedDay,
              session: academicSession,
              periods: collectRoutinePeriods(tbody),
            }),
          });

          const result = await response.json().catch(() => ({}));
          if (!response.ok) {
            throw new Error(result.message || `Failed to save routine for ${classKey}.`);
          }

          alert(`Routine for ${classKey} on ${selectedDay} saved successfully.`);
          return result;
        } catch (error) {
          console.error("Error saving routine:", error);
          alert(error.message || "Error saving routine. Please try again.");
          throw error;
        } finally {
          if (saveButton) {
            saveButton.disabled = false;
            saveButton.textContent = originalLabel;
          }
        }
      }

      function generateRoutine() {
        if (!classes.length) {
          tablesContainer.innerHTML =
            '<p class="error-message">Please create classes in Academic Records before generating a routine.</p>';
          return;
        }
        tablesContainer.innerHTML = "";
        const periodLimits = {};
        const teacherCount = {};

        classes.forEach((cls) => {
          const id = `${getElementKey(cls)}Periods`;
          periodLimits[cls] = parseInt(document.getElementById(id).value);
        });

        const teacherBookedPerPeriod = {};

        classes.forEach((cls) => {
          const classTitle = document.createElement("h2");
          classTitle.textContent = `Class: ${cls}`;
          const wrapper = document.createElement("div");
          wrapper.id = `wrapper-${getElementKey(cls)}`;
          const table = document.createElement("table");
          const thead = document.createElement("thead");
          thead.innerHTML = `
        <tr>
          <th>Period</th>
          <th>Time</th>
          <th>Teacher</th>
          <th>Subject</th>
          <th>Books Name</th>
        </tr>`;
          table.appendChild(thead);

          const tbody = document.createElement("tbody");
          let count = 0;

          for (let { period, time } of allPeriods) {
            if (period === "Break") {
              const breakRow = document.createElement("tr");
              breakRow.className = "break-row";
              breakRow.innerHTML = `<td colspan="5" class="break-row">Break Time (${time})</td>`;
              tbody.appendChild(breakRow);
              continue;
            }

            if (count >= periodLimits[cls]) continue;
            count++;

            const row = document.createElement("tr");
            const teacherSelect = document.createElement("select");
            teacherSelect.setAttribute("aria-label", "Select Teacher");
            const subjectSelect = document.createElement("select");
            subjectSelect.setAttribute("aria-label", "Select Subject");
            const bookInput = document.createElement("input");
            bookInput.type = "text";
            bookInput.placeholder = "Enter book name";

            let previousTeacher = null;

            const updateTeacherOptions = () => {
              const selected = teacherSelect.value;
              teacherSelect.innerHTML =
                `<option value="">--Select--</option>` +
                teachers
                  .map((t) => {
                    const booked =
                      teacherBookedPerPeriod[period]?.has(t) &&
                      t !== previousTeacher;
                    const count = teacherCount[t] || 0;
                    const label = `${t} (${count})`;
                    return `<option value="${t}" ${
                      booked ? "disabled" : ""
                    }>${label}</option>`;
                  })
                  .join("");

              if (selected) teacherSelect.value = selected;
            };

            const stripSelectedLabel = () => {
              const selectedValue = teacherSelect.value;
              if (!selectedValue) return;
              Array.from(teacherSelect.options).forEach((opt) => {
                if (opt.value === selectedValue)
                  opt.textContent = selectedValue;
              });
            };

            updateTeacherOptions();
            // Show plain teacher name when not interacting
            stripSelectedLabel();

            teacherSelect.addEventListener("change", (e) => {
              const selected = e.target.value;
              teacherBookedPerPeriod[period] =
                teacherBookedPerPeriod[period] || new Set();

              if (previousTeacher) {
                teacherBookedPerPeriod[period].delete(previousTeacher);
                teacherCount[previousTeacher] =
                  (teacherCount[previousTeacher] || 1) - 1;
              }

              if (selected) {
                teacherBookedPerPeriod[period].add(selected);
                teacherCount[selected] = (teacherCount[selected] || 0) + 1;
                previousTeacher = selected;
              } else {
                previousTeacher = null;
              }

              document.querySelectorAll("select").forEach((sel) => {
                if (sel !== teacherSelect && sel.options.length > 1) {
                  const event = new Event("teacher-update");
                  sel.dispatchEvent(event);
                }
              });
            });

            teacherSelect.addEventListener("focus", updateTeacherOptions);
            teacherSelect.addEventListener("blur", stripSelectedLabel);

            subjectSelect.innerHTML =
              `<option value="">--Select--</option>` +
              routineSubjects
                .map((s) => `<option value="${s.name}">${s.name}</option>`)
                .join("");

            row.innerHTML = `
          <td>${period}</td>
          <td>${time}</td>
          <td></td>
          <td></td>
          <td></td>
        `;
            row.children[2].appendChild(teacherSelect);
            row.children[3].appendChild(subjectSelect);
            row.children[4].appendChild(bookInput);
            tbody.appendChild(row);
          }

          table.appendChild(tbody);

          const actionDiv = document.createElement("div");
          actionDiv.className = "action-buttons";

          const saveBtn = document.createElement("button");
          saveBtn.textContent = "Save Routine";
          saveBtn.onclick = () => saveRoutineForClass(cls, tbody, dropdown.value, saveBtn);

          const pdfBtn = document.createElement("button");
          pdfBtn.textContent = "Download PDF";
          pdfBtn.onclick = () => {
            const opt = {
              margin: 0.3,
              filename: `${cls}-Routine.pdf`,
              image: { type: "jpeg", quality: 1 },
              html2canvas: { scale: 4 },
              jsPDF: { unit: "in", format: "letter", orientation: "portrait" },
            };
            html2pdf().set(opt).from(wrapper).save();
          };

          actionDiv.appendChild(saveBtn);
          actionDiv.appendChild(pdfBtn);
          wrapper.appendChild(classTitle);
          wrapper.appendChild(table);
          wrapper.appendChild(actionDiv);
          tablesContainer.appendChild(wrapper);
        });
      }

      document
        .getElementById("exportExcelBtn")
        .addEventListener("click", () => {
          const wb = XLSX.utils.book_new();

          const includeTeacher =
            document.getElementById("teacherCheck").checked;
          const includeSubject =
            document.getElementById("subjectCheck").checked;
          const includeBook = document.getElementById("bookCheck").checked;

          const allPeriods = new Set();
          const classPeriodDataMap = {};
          const teacherDataMap = {};

          classes.forEach((className) => {
            const wrapperId = `wrapper-${getElementKey(className)}`;
            const wrapper = document.getElementById(wrapperId);
            if (!wrapper) return;

            const rows = wrapper.querySelectorAll("tbody tr");

            classPeriodDataMap[className] = {};

            rows.forEach((row) => {
              if (row.classList.contains("break-row")) return;

              const period = row.cells[0].textContent.trim();
              const teacher = row.cells[2].querySelector("select")?.value || "";
              const subject =
                row.cells[3]?.querySelector("select")?.value || "";
              const book = row.cells[4]?.querySelector("input")?.value || "";

              allPeriods.add(period);

              classPeriodDataMap[className][period] = {
                teacher,
                subject,
                book,
              };

              // Build teacher data map
              if (teacher) {
                if (!teacherDataMap[teacher]) {
                  teacherDataMap[teacher] = {
                    subjects: new Set(),
                    periods: [],
                  };
                }
                if (subject) teacherDataMap[teacher].subjects.add(subject);
                teacherDataMap[teacher].periods.push(
                  `${className} - ${period}`
                );
              }
            });
          });

          const periods = Array.from(allPeriods);

          // Sheet 1: Class-wise Routine
          const routineSheetData = [["Class", ...periods]];

          classes.forEach((className) => {
            const row = [className];
            periods.forEach((period) => {
              const data = classPeriodDataMap[className]?.[period];
              let cellText = "";
              if (data) {
                const parts = [];
                if (includeTeacher && data.teacher) parts.push(data.teacher);
                if (includeSubject && data.subject) parts.push(data.subject);
                if (includeBook && data.book) parts.push(data.book);
                cellText = parts.join("\n");
              }
              row.push(cellText);
            });
            routineSheetData.push(row);
          });

          // Free Teachers Row
          const allTeachersSet = new Set(teachers);
          const freeRow = ["Free Teachers"];
          periods.forEach((period) => {
            const engagedTeachers = new Set();
            classes.forEach((className) => {
              const data = classPeriodDataMap[className]?.[period];
              if (data && data.teacher) {
                engagedTeachers.add(data.teacher);
              }
            });
            const freeTeachers = [...allTeachersSet].filter(
              (t) => !engagedTeachers.has(t)
            );
            freeRow.push(freeTeachers.join(", "));
          });

          routineSheetData.push(freeRow);

          // Only create sheet if there is at least one period column
          if (periods.length > 0) {
            const ws1 = XLSX.utils.aoa_to_sheet(routineSheetData);
            XLSX.utils.book_append_sheet(wb, ws1, "Class-wise Routine");
          }

          // Sheet 2: Teacher-wise Summary
          const teacherSummaryData = [
            ["Teacher", "Subjects", "Assigned Periods"],
          ];

          Object.entries(teacherDataMap).forEach(([teacher, info]) => {
            const subjects = Array.from(info.subjects).join(", ");
            const periods = info.periods.join(", ");
            teacherSummaryData.push([teacher, subjects, periods]);
          });

          // Only add teacher summary sheet if there is any data
          if (teacherSummaryData.length > 1) {
            const ws2 = XLSX.utils.aoa_to_sheet(teacherSummaryData);
            XLSX.utils.book_append_sheet(wb, ws2, "Teacher-wise Summary");
          }

          // If no sheets were added, show a friendly message instead of throwing
          if (!wb.SheetNames || wb.SheetNames.length === 0) {
            alert("No data available to export. Please generate or fetch a routine first.");
            return;
          }

          // Export
          XLSX.writeFile(wb, "Routine_With_Teacher_Summary.xlsx");
        });

      const fetchRoutineBtn = document.createElement("button");
      fetchRoutineBtn.textContent = "Fetch Routine for Selected Day";
      fetchRoutineBtn.id = "fetchRoutineBtn";

      fetchRoutineBtn.onclick = () => {
        const selectedDay = dropdown.value;

        fetch(
          `${API_BASE_URL}/routines/get-routine?day=${encodeURIComponent(
            selectedDay
          )}&session=${encodeURIComponent(academicSession)}`
        )
          .then((response) => {
            if (!response.ok) {
              throw new Error(
                `Failed to fetch routine for ${selectedDay}. Status: ${response.status}`
              );
            }
            return response.json();
          })
          .then((data) => {
            console.log("Fetched Routine Data:", data);

            // Clear existing tables
            tablesContainer.innerHTML = "";

            // Normalize response into an array of routines
            let routinesArray = [];

            if (Array.isArray(data)) {
              routinesArray = data;
            } else if (Array.isArray(data.routines)) {
              routinesArray = data.routines;
            } else if (data.routine) {
              routinesArray = Array.isArray(data.routine)
                ? data.routine
                : [data.routine];
            }

            if (!routinesArray || routinesArray.length === 0) {
              tablesContainer.innerHTML = `<p class="error-message">No routine found for ${selectedDay}.</p>`;
              return;
            }

            // Track counts and per-period bookings for fetched view
            const teacherCount = {};
            const teacherBookedPerPeriod = {};

            routinesArray.forEach((routineItem) => {
              const cls =
                routineItem.class ||
                routineItem.className ||
                routineItem.class_id ||
                "Unknown Class";

              // For this selected day, try to extract an array of periods
              let periods = [];
              if (Array.isArray(routineItem.periods)) {
                periods = routineItem.periods;
              } else if (
                routineItem.routines &&
                Array.isArray(routineItem.routines[selectedDay])
              ) {
                periods = routineItem.routines[selectedDay];
              }

              if (!periods || periods.length === 0) return;

              const classTitle = document.createElement("h2");
              classTitle.textContent = `Class: ${cls} (${selectedDay})`;

              const wrapper = document.createElement("div");
              const table = document.createElement("table");
              const thead = document.createElement("thead");
              thead.innerHTML = `
                <tr>
                  <th>Period</th>
                  <th>Time</th>
                  <th>Teacher</th>
                  <th>Subject</th>
                  <th>Books Name</th>
                </tr>`;
              table.appendChild(thead);

              const tbody = document.createElement("tbody");

              periods.forEach((p) => {
                if (p.period === "Break") {
                  const breakRow = document.createElement("tr");
                  breakRow.className = "break-row";
                  breakRow.innerHTML = `<td colspan="5" class="break-row">Break Time (${p.time || ""})</td>`;
                  tbody.appendChild(breakRow);
                  return;
                }

                const row = document.createElement("tr");

                // Teacher select with count + conflict disabling (same logic as generateRoutine)
                let previousTeacher = null;

                const teacherSelect = document.createElement("select");
                teacherSelect.setAttribute("aria-label", "Select Teacher");
                const updateTeacherOptions = () => {
                  const selected = teacherSelect.value || p.teacher || "";
                  teacherSelect.innerHTML =
                    `<option value="">--Select--</option>` +
                    teachers
                      .map((t) => {
                        const booked =
                          teacherBookedPerPeriod[p.period]?.has(t) &&
                          t !== previousTeacher;
                        const count = teacherCount[t] || 0;
                        const label = `${t} (${count})`;
                        return `<option value="${t}" ${
                          booked ? "disabled" : ""
                        }>${label}</option>`;
                      })
                      .join("");

                  if (selected) teacherSelect.value = selected;
                };

                const stripSelectedLabel = () => {
                  const selectedValue = teacherSelect.value;
                  if (!selectedValue) return;
                  Array.from(teacherSelect.options).forEach((opt) => {
                    if (opt.value === selectedValue)
                      opt.textContent = selectedValue;
                  });
                };

                // Initialize per-period teacher bookings and global counts based on existing data
                if (p.teacher) {
                  teacherBookedPerPeriod[p.period] =
                    teacherBookedPerPeriod[p.period] || new Set();
                  teacherBookedPerPeriod[p.period].add(p.teacher);
                  teacherCount[p.teacher] = (teacherCount[p.teacher] || 0) + 1;
                  previousTeacher = p.teacher;
                }

                updateTeacherOptions();
                // Show plain teacher name when not interacting
                stripSelectedLabel();

                teacherSelect.addEventListener("change", (e) => {
                  const selected = e.target.value;
                  teacherBookedPerPeriod[p.period] =
                    teacherBookedPerPeriod[p.period] || new Set();

                  if (previousTeacher) {
                    teacherBookedPerPeriod[p.period].delete(previousTeacher);
                    teacherCount[previousTeacher] =
                      (teacherCount[previousTeacher] || 1) - 1;
                  }

                  if (selected) {
                    teacherBookedPerPeriod[p.period].add(selected);
                    teacherCount[selected] = (teacherCount[selected] || 0) + 1;
                    previousTeacher = selected;
                  } else {
                    previousTeacher = null;
                  }

                  document.querySelectorAll("select").forEach((sel) => {
                    if (sel !== teacherSelect && sel.options.length > 1) {
                      const event = new Event("teacher-update");
                      sel.dispatchEvent(event);
                    }
                  });
                });

                teacherSelect.addEventListener("focus", updateTeacherOptions);
                teacherSelect.addEventListener("blur", stripSelectedLabel);
                teacherSelect.addEventListener(
                  "teacher-update",
                  updateTeacherOptions
                );

                // Subject select
                const subjectSelect = document.createElement("select");
                subjectSelect.setAttribute("aria-label", "Select Subject");
                subjectSelect.innerHTML =
                  `<option value="">--Select--</option>` +
                  routineSubjects
                    .map(
                      (s) =>
                        `<option value="${s.name}" ${
                          p.subject === s.name ? "selected" : ""
                        }>${s.name}</option>`
                    )
                    .join("");

                // Book input
                const bookInput = document.createElement("input");
                bookInput.type = "text";
                bookInput.placeholder = "Enter book name";
                bookInput.value = p.book || "";

                row.innerHTML = `
                  <td>${p.period || ""}</td>
                  <td>${p.time || ""}</td>
                  <td></td>
                  <td></td>
                  <td></td>
                `;

                row.children[2].appendChild(teacherSelect);
                row.children[3].appendChild(subjectSelect);
                row.children[4].appendChild(bookInput);

                tbody.appendChild(row);
              });

              table.appendChild(tbody);

              // Action buttons (Save + PDF) same as generateRoutine tables
              const actionDiv = document.createElement("div");
              actionDiv.className = "action-buttons";

              const saveBtn = document.createElement("button");
              saveBtn.textContent = "Save Routine";
              saveBtn.onclick = () => saveRoutineForClass(cls, tbody, selectedDay, saveBtn);

              const pdfBtn = document.createElement("button");
              pdfBtn.textContent = "Download PDF";
              pdfBtn.onclick = () => {
                const opt = {
                  margin: 0.3,
                  filename: `${cls}-Routine-${selectedDay}.pdf`,
                  image: { type: "jpeg", quality: 1 },
                  html2canvas: { scale: 4 },
                  jsPDF: {
                    unit: "in",
                    format: "letter",
                    orientation: "portrait",
                  },
                };
                html2pdf().set(opt).from(wrapper).save();
              };

              actionDiv.appendChild(saveBtn);
              actionDiv.appendChild(pdfBtn);

              wrapper.appendChild(classTitle);
              wrapper.appendChild(table);
              wrapper.appendChild(actionDiv);
              tablesContainer.appendChild(wrapper);
            });
          })
          .catch((error) => {
            console.error("Error fetching routine:", error);
            alert(
              `Error fetching routine for ${selectedDay}. Please try again.`
            );
            // Optionally clear the displayed routine or show an error message in the UI
            tablesContainer.innerHTML = `<p class="error-message">Error fetching routine for ${selectedDay}.</p>`;
          });
      };

   
      async function initializeRoutinePage() {
        await loadSessions();
        await loadAcademicClasses();
        await loadTeachers();
        await loadSubjects();
        createSettings();

        // Teacher form
        document
          .getElementById("addTeacherBtn")
          .addEventListener("click", saveTeacher);
        document
          .getElementById("reloadTeachersBtn")
          .addEventListener("click", async () => {
            await loadTeachers();
            // existing selects will pick up new teachers when focused,
            // due to updateTeacherOptions logic
            alert("Teachers reloaded.");
          });

        // Session form
        document
          .getElementById("addSessionBtn")
          .addEventListener("click", saveSession);
        document
          .getElementById("reloadSessionsBtn")
          .addEventListener("click", async () => {
            await loadSessions();
            alert("Sessions reloaded.");
          });

        document
          .getElementById("reloadClassesBtn")
          .addEventListener("click", async () => {
            await loadAcademicClasses();
            createSettings();
            alert("Classes reloaded.");
          });

        document
          .getElementById("manageTeachersBtn")
          .addEventListener("click", openTeacherManager);
        document
          .getElementById("manageSubjectsBtn")
          .addEventListener("click", openSubjectManager);

        modalCloseBtn.addEventListener("click", closeModal);
        modalOverlay.addEventListener("click", (e) => {
          if (e.target === modalOverlay) {
            closeModal();
          }
        });
      }

      document.addEventListener("DOMContentLoaded", async () => {
        if (!Auth.isAuthenticated()) {
          Auth.redirectToLogin();
          return;
        }

        await initializeRoutinePage();
      });

      // teacher wise day routine

      document
        .getElementById("exportExcelBtnt")
        .addEventListener("click", () => {
          const wb = XLSX.utils.book_new();
          const teacherWiseData = {};
          const selectedDay = document.getElementById("days").value;

          const includeClass = true; // Always include class
          const includeSubject = true; // Always include subject
          const includeBook = true; // Always include book

          classes.forEach((className) => {
            const wrapperId = `wrapper-${getElementKey(className)}`;
            const wrapper = document.getElementById(wrapperId);
            if (!wrapper) return;

            const rows = wrapper.querySelectorAll("tbody tr");

            rows.forEach((row) => {
              if (row.classList.contains("break-row")) return;

              const period = row.cells[0].textContent.trim();
              const time = row.cells[1].textContent.trim();
              const teacher = row.cells[2].querySelector("select")?.value || "";
              const subject =
                row.cells[3]?.querySelector("select")?.value || "";
              const book = row.cells[4]?.querySelector("input")?.value || "";

              if (teacher) {
                if (!teacherWiseData[teacher]) {
                  teacherWiseData[teacher] = [];
                }
                const periodInfo = {
                  Period: period,
                  Time: time,
                  Class: className,
                  Subject: subject, // Include subject by default
                  "Book Name": book, // Include book name by default
                };

                teacherWiseData[teacher].push(periodInfo);
              }
            });
          });

          // Flag to track whether any sheet was added
          let hasSheets = false;

          for (const teacher in teacherWiseData) {
            if (teacherWiseData.hasOwnProperty(teacher)) {
              const teacherSchedule = teacherWiseData[teacher];
              if (teacherSchedule.length > 0) {
                // Create header row
                const header = Object.keys(teacherSchedule[0]);
                const dataRows = [
                  header,
                  ...teacherSchedule.map((schedule) => Object.values(schedule)),
                ];
                const ws = XLSX.utils.aoa_to_sheet(dataRows);
                XLSX.utils.book_append_sheet(wb, ws, teacher);
                hasSheets = true;
              } else {
                const ws = XLSX.utils.aoa_to_sheet([
                  ["No classes assigned for this day."],
                ]);
                XLSX.utils.book_append_sheet(wb, ws, teacher);
                hasSheets = true;
              }
            }
          }

          // If no teacher data / sheets, show friendly message instead of error
          if (!hasSheets || !wb.SheetNames || wb.SheetNames.length === 0) {
            alert(
              "No teacher-wise data available to export. Please generate a routine first."
            );
            return;
          }

          XLSX.writeFile(wb, `Teacher_Wise_Routine_${selectedDay}.xlsx`);
        });
    </script>
