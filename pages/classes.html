<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Classes - Skyview Admin</title>

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Font Awesome -->
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<!-- Your CSS -->
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/navbar.css">

<style>
    body {
    font-family: 'Poppins', sans-serif;
    background-color: #f5f7fb;
}
.class-card {
    border-radius: 10px;
    cursor: pointer;
    background: #fff;

    /* 🔵 BLUE BORDER */
    border: 1px solid #0d6efd;

    /* 🔥 SOFT SHADOW */
    box-shadow: 0 4px 12px rgba(13, 110, 253, 0.15);

    transition: 0.25s ease;
}

.class-card:hover {
    transform: translateY(-4px);

    /* 🔥 STRONGER SHADOW ON HOVER */
    box-shadow: 0 8px 20px rgba(13, 110, 253, 0.25);
}

/* HEADER */
.class-card-header {
    background: #f1f6ff;
    color: #0d6efd;
    padding: 12px 16px;
    font-weight: 600;
    border-bottom: 1px solid #e0eaff;
}

/* BODY */
.class-card-body {
    padding: 16px;
}

.class-row {
    display: flex;
    justify-content: space-between;
    margin-bottom: 10px;
    font-size: 14px;
    color: #444;
}

/* FOOTER */
.class-card-footer {
    padding: 12px 16px;
    border-top: 1px solid #eee;
    text-align: right;
}
</style>

</head>

<body>

<!-- Navbar -->
<div id="navbar-container"></div>

<div class="container mt-4">

    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 id="title">
            <i class="fas fa-chalkboard"></i> Classes
        </h3>

        <button class="btn btn-secondary" onclick="goBack()">
            <i class="fas fa-arrow-left"></i> Back
        </button>
    </div>

    <!-- Loader -->
    <div id="loader" class="loader">
        <div class="spinner-border text-primary"></div>
        <p class="mt-2">Loading classes...</p>
    </div>

    <!-- No Data -->
    <div id="noData" class="text-center mt-5" style="display:none;">
        <i class="fas fa-folder-open fa-3x text-muted mb-3"></i>
        <h5>No Classes Found</h5>
    </div>

    <!-- Class Cards -->
    <div class="row" id="classContainer"></div>

</div>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/config.js"></script>
<script src="../js/auth.js"></script>
<script src="../components/navbar.js"></script>

<script>
const API_BASE_URL = CONFIG.API_URL;
// ✅ Get year from URL
function getYear() {
    const params = new URLSearchParams(window.location.search);
    return params.get('year');
}

// ✅ Back button
function goBack() {
    window.history.back();
}

// ✅ Load classes
async function loadClasses() {

    const year = getYear();

    if (!year) {
        alert("Academic year missing!");
        return;
    }

    document.getElementById('title').innerHTML =
        `<i class="fas fa-chalkboard"></i> Classes - ${year}`;

    try {

        const token = localStorage.getItem(CONFIG.STORAGE_KEYS.TOKEN);

        if (!token) {
            window.location.href = '../pages/login.html';
            return;
        }

        const response = await fetch(`${API_BASE_URL}/classes/year/${year}`, {
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}`
            }
        });

        // ❌ Handle Unauthorized
        if (response.status === 401) {
            alert("Session expired. Please login again.");
            window.location.href = '../pages/login.html';
            return;
        }

        const data = await response.json();

        console.log("Classes API:", data);

        document.getElementById('loader').style.display = 'none';

        // ❌ Not array
        if (!Array.isArray(data)) {
            document.getElementById('noData').style.display = 'block';
            return;
        }

        // ❌ Empty
        if (data.length === 0) {
            document.getElementById('noData').style.display = 'block';
            return;
        }

        displayClasses(data);

    } catch (error) {
        console.error(error);
        alert("Error loading classes");
    }
}

// ✅ Display classes
function displayClasses(classes) {

    const container = document.getElementById('classContainer');
    container.innerHTML = '';

    classes.forEach(cls => {

        const card = document.createElement('div');
        card.className = 'col-md-4 mb-4';

        card.innerHTML = `
            <div class="class-card"
                 onclick="openClass('${cls.className}', '${cls.section}', '${cls.academicYear}')">

                <div class="class-card-header">
                    Class ${cls.className} - ${cls.section || 'A'}
                </div>

                <div class="class-card-body">

                    <div class="class-row">
                        <span><i class="fas fa-user-tie text-primary"></i> Teacher</span>
                        <strong>${cls.classTeacher || 'N/A'}</strong>
                    </div>

                    <div class="class-row">
                        <span><i class="fas fa-users text-success"></i> Students</span>
                        <strong>${cls.studentCount || 0}</strong>
                    </div>

                    <div class="class-row">
                        <span><i class="fas fa-book text-warning"></i> Subjects</span>
                        <strong>${cls.subjects ? cls.subjects.length : 0}</strong>
                    </div>

                </div>

                <div class="class-card-footer">
                    <button class="btn btn-sm btn-outline-primary">
                        View Class
                    </button>
                </div>

            </div>
        `;

        container.appendChild(card);
    });
}
    
    // ✅ Open class students page
function openClass(className, section, year) {
    window.location.href =
        `class-students.html?class=${encodeURIComponent(className)}&section=${encodeURIComponent(section)}&session=${encodeURIComponent(year)}`;
}

// INIT
document.addEventListener('DOMContentLoaded', () => {

    if (!Auth.isAuthenticated()) {
        Auth.redirectToLogin();
        return;
    }

    loadClasses();
});

</script>

    <script src='../js/page-shell.js'></script>
</body>
</html>
