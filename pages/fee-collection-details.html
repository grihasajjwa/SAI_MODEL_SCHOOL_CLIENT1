<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fee Collection Details - Skyview Public School</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/navbar.css">
    <style>
        body { background: linear-gradient(180deg, #edf4ff, #ffffff); }
        .table-card {
            border-radius: 18px;
            box-shadow: 0 10px 28px rgba(28, 65, 118, 0.08);
            border: none;
        }
    </style>
</head>
<body>
    <div id="navbar-container"></div>

    <div class="container-fluid py-4" style="max-width: 1320px;">
        <div class="card table-card mb-4">
            <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                <h4 class="mb-0" id="detailsTitle">Fee Collection Details</h4>
                <a href="fee-transactions.html" class="btn btn-light btn-sm">
                    <i class="fas fa-arrow-left me-2"></i>Back to Summary
                </a>
            </div>
            <div class="card-body">
                <form id="detailsFilterForm" class="row g-3 align-items-end">
                    <div class="col-md-2">
                        <label class="form-label" for="detailSession">Session</label>
                        <select class="form-select" id="detailSession"></select>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label" for="detailMonth">Month</label>
                        <select class="form-select" id="detailMonth"></select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label" for="detailParticular">Particular</label>
                        <select class="form-select" id="detailParticular"></select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label" for="detailStudentName">Student Name</label>
                        <input type="search" class="form-control" id="detailStudentName" placeholder="Search student name">
                    </div>
                    <div class="col-md-2 d-flex gap-2">
                        <button type="submit" class="btn btn-primary flex-grow-1">
                            <i class="fas fa-search me-2"></i>Search
                        </button>
                        <button type="button" class="btn btn-outline-secondary" id="detailResetBtn">Reset</button>
                    </div>
                </form>
            </div>
        </div>

        <div class="row g-4 mb-4">
            <div class="col-md-3">
                <div class="card table-card">
                    <div class="card-body">
                        <div class="text-muted small">Total</div>
                        <div class="h4 mb-0 text-primary"><span id="detailTotal">0.00</span></div>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card table-card">
                    <div class="card-body">
                        <div class="text-muted small">Count</div>
                        <div class="h4 mb-0 text-danger"><span id="detailCount">0</span></div>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card table-card">
                    <div class="card-body">
                        <div class="text-muted small">Session</div>
                        <div class="h4 mb-0 text-primary"><span id="detailSessionCard">-</span></div>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card table-card">
                    <div class="card-body">
                        <div class="text-muted small">Particular</div>
                        <div class="h4 mb-0 text-success"><span id="detailParticularCard">-</span></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="card table-card">
            <div class="card-header bg-success text-white">
                <h5 class="mb-0">Collection List</h5>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped table-bordered align-middle">
                        <thead class="table-light">
                            <tr>
                                <th>Sl No.</th>
                                <th>ADM NO.</th>
                                <th>Student Name</th>
                                <th>Particular</th>
                                <th>Month</th>
                                <th>Date</th>
                                <th class="text-end">Amount</th>
                                <th>Receipt</th>
                            </tr>
                        </thead>
                        <tbody id="detailsTableBody">
                            <tr>
                                <td colspan="7" class="text-center text-muted py-4">Loading details...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mt-3">
                    <div class="d-flex align-items-center gap-2">
                        <label class="text-muted small" for="detailPageSize">Rows per page</label>
                        <select class="form-select form-select-sm" id="detailPageSize" style="width: 90px;">
                            <option value="10">10</option>
                            <option value="25" selected>25</option>
                            <option value="50">50</option>
                            <option value="100">100</option>
                        </select>
                    </div>
                    <div class="text-muted small" id="detailPaginationInfo">0 rows</div>
                    <div class="btn-group btn-group-sm" role="group" aria-label="Details pagination">
                        <button type="button" class="btn btn-outline-primary" id="detailPrevPage">
                            <i class="fas fa-chevron-left me-1"></i>Prev
                        </button>
                        <button type="button" class="btn btn-outline-primary" id="detailNextPage">
                            Next<i class="fas fa-chevron-right ms-1"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/api.js"></script>
    <script src="../components/navbar.js"></script>
    <script src="../js/fee-collection-details.js"></script>
    <script src="../js/page-shell.js"></script>
</body>
</html>
